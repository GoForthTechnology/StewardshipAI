name: Build and Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_LOCATION }}
  GAR_LOCATION: ${{ secrets.GCP_LOCATION }}
  REPOSITORY: stewardship-ai
  IMAGE: app

jobs:
  deploy:
    # Add 'id-token' with 'write' permissions for Workload Identity Federation
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Setup Workload Identity Federation ---
      # 1. Create a Workload Identity Pool
      # 2. Create a Workload Identity Provider
      # 3. Allow GitHub Actions service account to impersonate a GCP Service Account
      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      # Authenticate Docker to Google Cloud Artifact Registry
      - name: Docker Auth
        id: docker-auth
        uses: 'docker/login-action@v3'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'

      - name: Build and Push Container
        run: |-
          docker build -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}" .
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"

      # Note: Infrastructure updates (Terraform) are currently handled manually.
      # Future enhancement: Add 'terraform apply' step here.
      
      # For now, we just update the Cloud Run service with the new image
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: stewardship-ai-ui
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}

      # If required, use the Cloud Run url output in later steps
      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}

# --- REQUIRED GITHUB SECRETS ---
# GCP_PROJECT_ID: The alphanumeric project ID
# GCP_LOCATION: e.g., us-south1
# WIF_PROVIDER: Full resource name of the Workload Identity Provider
# WIF_SERVICE_ACCOUNT: Email of the service account for GitHub Actions
